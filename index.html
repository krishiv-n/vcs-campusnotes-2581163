<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CampusNotes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>CampusNotes</h1>
  <p id="count" aria-live="polite"></p>
  <form id="note-form">
    <input id="title" placeholder="Course / title" required>
    <textarea id="body" placeholder="Write your note..." required></textarea>
    <button type="submit">Save note</button>
  </form>
  <ul id="notes"></ul>
  <script src="app.js"></script>
</body>
</html>
